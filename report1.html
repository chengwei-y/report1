<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🦴 下肢带骨 · 解剖学小游戏</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f5f0eb 0%, #e8dfd8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        /* ===== 卡片容器 ===== */
        .game-container {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px 48px 40px 40px;
            padding: 32px 32px 40px;
            box-shadow:
                0 20px 60px rgba(90, 60, 40, 0.20),
                0 8px 24px rgba(90, 60, 40, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #3d2c1e;
            letter-spacing: -0.5px;
        }

        .title .icon {
            font-size: 2rem;
            line-height: 1;
        }

        .score-badge {
            background: #3d2c1e;
            color: #f5ede6;
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 12px rgba(61, 44, 30, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .score-badge span {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f5d742;
        }

        /* ===== 进度条 ===== */
        .progress-wrapper {
            margin-bottom: 28px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            color: #6b5a4a;
            margin-bottom: 6px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: #ddd2c8;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.06);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #b48b7a, #8b6b5a);
            border-radius: 12px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ===== 题目区 ===== */
        .question-area {
            background: rgba(255, 250, 245, 0.6);
            border-radius: 32px;
            padding: 28px 28px 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: inset 0 2px 8px rgba(90, 60, 40, 0.04);
        }

        .question-number {
            font-size: 0.8rem;
            font-weight: 600;
            color: #a08472;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            color: #2d1f14;
            line-height: 1.5;
            min-height: 3.2rem;
        }

        /* ===== 选项列表 ===== */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 16px 22px;
            background: rgba(255, 248, 242, 0.7);
            border: 2px solid rgba(200, 180, 166, 0.3);
            border-radius: 20px;
            font-size: 1.05rem;
            font-weight: 500;
            color: #2d1f14;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
            box-shadow: 0 2px 8px rgba(90, 60, 40, 0.04);
            position: relative;
            user-select: none;
        }

        .option-btn:hover:not(.disabled) {
            background: rgba(245, 235, 226, 0.9);
            border-color: #b48b7a;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(90, 60, 40, 0.10);
        }

        .option-btn .letter {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #e8ddd2;
            color: #4d3a2a;
            font-weight: 700;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .option-btn:hover:not(.disabled) .letter {
            background: #b48b7a;
            color: #fff;
        }

        .option-btn .text {
            flex: 1;
        }

        /* ---- 选项状态 ---- */
        .option-btn.correct {
            border-color: #2b8a5e;
            background: rgba(43, 138, 94, 0.12);
            box-shadow: 0 0 0 4px rgba(43, 138, 94, 0.08);
        }

        .option-btn.correct .letter {
            background: #2b8a5e;
            color: #fff;
        }

        .option-btn.wrong {
            border-color: #c0392b;
            background: rgba(192, 57, 43, 0.10);
            box-shadow: 0 0 0 4px rgba(192, 57, 43, 0.08);
        }

        .option-btn.wrong .letter {
            background: #c0392b;
            color: #fff;
        }

        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
            transform: none !important;
            box-shadow: none !important;
        }

        .option-btn.disabled:hover {
            transform: none !important;
            box-shadow: none !important;
        }

        .option-btn.reveal-correct {
            border-color: #2b8a5e;
            background: rgba(43, 138, 94, 0.08);
        }

        .option-btn.reveal-correct .letter {
            background: #2b8a5e;
            color: #fff;
        }

        /* ===== 反馈区 ===== */
        .feedback-area {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 0 4px;
            margin-bottom: 8px;
        }

        .feedback-message {
            font-size: 1rem;
            font-weight: 500;
            padding: 8px 0;
            flex: 1;
            min-width: 140px;
        }

        .feedback-message .emoji {
            font-size: 1.4rem;
            margin-right: 10px;
        }

        .feedback-message.correct {
            color: #1e7a4a;
        }

        .feedback-message.wrong {
            color: #b03a2e;
        }

        .feedback-message .explanation {
            display: block;
            font-weight: 400;
            font-size: 0.92rem;
            color: #6b5a4a;
            margin-top: 4px;
            opacity: 0.85;
        }

        .next-btn {
            padding: 12px 32px;
            background: #3d2c1e;
            color: #f5ede6;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(61, 44, 30, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .next-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(61, 44, 30, 0.30);
            background: #4d3828;
        }

        .next-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: 0 2px 8px rgba(61, 44, 30, 0.10);
        }

        /* ===== 结果面板 ===== */
        .result-panel {
            display: none;
            text-align: center;
            padding: 20px 10px 6px;
            animation: fadeUp 0.6s ease;
        }

        .result-panel.show {
            display: block;
        }

        .result-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
            display: block;
        }

        .result-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #2d1f14;
            margin-bottom: 4px;
        }

        .result-sub {
            font-size: 1.1rem;
            color: #6b5a4a;
            margin-bottom: 18px;
        }

        .result-stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .number {
            font-size: 2.2rem;
            font-weight: 700;
            color: #3d2c1e;
            display: block;
        }

        .stat-item .label {
            font-size: 0.8rem;
            color: #8a7a6a;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-item .number.green {
            color: #2b8a5e;
        }
        .stat-item .number.red {
            color: #c0392b;
        }

        .restart-btn {
            padding: 14px 48px;
            background: #b48b7a;
            color: #fff;
            border: none;
            border-radius: 60px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 16px rgba(180, 139, 122, 0.30);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(180, 139, 122, 0.40);
            background: #a07866;
        }

        /* ===== 动画 ===== */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(18px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 540px) {
            .game-container {
                padding: 20px 16px 28px;
                border-radius: 32px;
            }

            .title {
                font-size: 1.2rem;
            }
            .title .icon {
                font-size: 1.5rem;
            }
            .score-badge {
                font-size: 0.8rem;
                padding: 6px 14px;
            }
            .score-badge span {
                font-size: 1.1rem;
            }

            .question-text {
                font-size: 1.1rem;
            }
            .question-area {
                padding: 20px 16px 16px;
            }

            .option-btn {
                padding: 14px 16px;
                font-size: 0.95rem;
                gap: 12px;
                border-radius: 16px;
            }
            .option-btn .letter {
                width: 30px;
                height: 30px;
                font-size: 0.8rem;
            }

            .feedback-area {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .next-btn {
                justify-content: center;
                padding: 12px 20px;
                width: 100%;
            }

            .result-stats {
                gap: 16px;
            }
            .stat-item .number {
                font-size: 1.8rem;
            }
            .result-title {
                font-size: 1.4rem;
            }
        }

        @media (max-width: 380px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .score-badge {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="game-container" role="main" aria-label="下肢带骨解剖学小游戏">

        <!-- ===== 头部 ===== -->
        <div class="header">
            <div class="title">
                <span class="icon">🦴</span>
                <span>下肢带骨</span>
            </div>
            <div class="score-badge">
                🏆 得分&ensp;<span id="scoreDisplay">0</span>
            </div>
        </div>

        <!-- ===== 进度条 ===== -->
        <div class="progress-wrapper">
            <div class="progress-label">
                <span id="progressText">第 1 / 5 题</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- ===== 题目 & 选项 ===== -->
        <div id="quizContainer">
            <div class="question-area">
                <div class="question-number" id="questionNumber">问题 1</div>
                <div class="question-text" id="questionText">加载题目中…</div>
            </div>

            <div class="options-grid" id="optionsContainer">
                <!-- 由 JavaScript 动态生成 -->
            </div>

            <div class="feedback-area">
                <div class="feedback-message" id="feedbackMessage">
                    <span class="emoji">💡</span>
                    选择一个选项开始
                </div>
                <button class="next-btn" id="nextBtn" disabled>
                    下一题 →
                </button>
            </div>
        </div>

        <!-- ===== 结果面板 ===== -->
        <div class="result-panel" id="resultPanel">
            <span class="result-emoji" id="resultEmoji">🎉</span>
            <div class="result-title" id="resultTitle">完成！</div>
            <div class="result-sub" id="resultSub">你已答完所有题目</div>
            <div class="result-stats">
                <div class="stat-item">
                    <span class="number green" id="resultCorrect">0</span>
                    <span class="label">✅ 正确</span>
                </div>
                <div class="stat-item">
                    <span class="number red" id="resultWrong">0</span>
                    <span class="label">❌ 错误</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="resultScore">0</span>
                    <span class="label">⭐ 得分</span>
                </div>
            </div>
            <button class="restart-btn" id="restartBtn">🔄 重新挑战</button>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  题库
            // ============================================================
            const QUESTIONS = [{
                id: 1,
                question: '以下哪块骨不属于下肢带骨？',
                options: ['髋骨', '股骨', '锁骨', '胫骨'],
                correct: 2, // 索引 0-based → 锁骨
                explanation: '锁骨属于上肢带骨，连接胸骨与肩胛骨。'
            }, {
                id: 2,
                question: '髋骨由哪三块骨融合而成？',
                options: ['髂骨、坐骨、耻骨', '髂骨、坐骨、骶骨', '髂骨、耻骨、骶骨', '坐骨、耻骨、骶骨'],
                correct: 0,
                explanation: '髋骨由髂骨、坐骨和耻骨三块骨在髋臼处融合而成。'
            }, {
                id: 3,
                question: '人体最长的骨是哪一块？',
                options: ['胫骨', '腓骨', '股骨', '髋骨'],
                correct: 2,
                explanation: '股骨是人体最长、最粗壮的长骨，约占身高的四分之一。'
            }, {
                id: 4,
                question: '髌骨位于人体哪个部位？',
                options: ['膝关节前方', '膝关节后方', '髋关节前方', '踝关节前方'],
                correct: 0,
                explanation: '髌骨（膝盖骨）位于膝关节前方，是人体最大的籽骨。'
            }, {
                id: 5,
                question: '以下哪块骨属于足部跗骨？',
                options: ['舟骨', '月骨', '三角骨', '豌豆骨'],
                correct: 0,
                explanation: '舟骨是跗骨之一，位于足内侧纵弓。月骨、三角骨、豌豆骨均为腕骨。'
            }];

            const TOTAL = QUESTIONS.length;

            // ============================================================
            //  DOM 引用
            // ============================================================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const questionNumber = $('#questionNumber');
            const questionText = $('#questionText');
            const optionsContainer = $('#optionsContainer');
            const feedbackMessage = $('#feedbackMessage');
            const nextBtn = $('#nextBtn');
            const scoreDisplay = $('#scoreDisplay');
            const progressFill = $('#progressFill');
            const progressText = $('#progressText');
            const progressPercent = $('#progressPercent');

            const quizContainer = $('#quizContainer');
            const resultPanel = $('#resultPanel');
            const resultEmoji = $('#resultEmoji');
            const resultTitle = $('#resultTitle');
            const resultSub = $('#resultSub');
            const resultCorrect = $('#resultCorrect');
            const resultWrong = $('#resultWrong');
            const resultScore = $('#resultScore');
            const restartBtn = $('#restartBtn');

            // ============================================================
            //  状态
            // ============================================================
            let currentIndex = 0; // 当前题目索引 (0-based)
            let score = 0; // 答对数量
            let answered = false; // 当前题目是否已作答
            let selectedIndex = -1; // 当前选中选项索引

            // 记录每道题是否答对 (用于结果页)
            const results = new Array(TOTAL).fill(null); // null | true | false

            // ============================================================
            //  渲染函数
            // ============================================================
            function renderQuestion(index) {
                const q = QUESTIONS[index];
                if (!q) return;

                // 更新题号 & 文本
                questionNumber.textContent = `问题 ${index + 1}`;
                questionText.textContent = q.question;

                // 生成选项
                const letters = ['A', 'B', 'C', 'D'];
                optionsContainer.innerHTML = '';
                q.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.setAttribute('data-index', i);
                    btn.innerHTML = `
                        <span class="letter">${letters[i]}</span>
                        <span class="text">${opt}</span>
                    `;
                    btn.addEventListener('click', () => handleOptionClick(i));
                    optionsContainer.appendChild(btn);
                });

                // 重置状态
                answered = false;
                selectedIndex = -1;
                nextBtn.disabled = true;

                // 清除所有选项状态
                document.querySelectorAll('.option-btn').forEach(el => {
                    el.classList.remove('correct', 'wrong', 'disabled', 'reveal-correct');
                });

                // 更新反馈
                feedbackMessage.innerHTML = `<span class="emoji">💡</span> 选择一个选项作答`;
                feedbackMessage.className = 'feedback-message';

                // 更新进度
                updateProgress(index);

                // 如果之前这道题有记录，恢复状态（例如重新开始后）
                const prevResult = results[index];
                if (prevResult === true) {
                    // 如果之前答对过，但重新开始后我们重置了 results，所以不会进来
                }
                // 但为了安全，重置 results 在 restart 中处理
            }

            function updateProgress(index) {
                const pct = ((index) / TOTAL) * 100;
                progressFill.style.width = pct + '%';
                progressText.textContent = `第 ${index + 1} / ${TOTAL} 题`;
                progressPercent.textContent = Math.round(pct) + '%';
            }

            function updateScore() {
                scoreDisplay.textContent = score;
            }

            // ============================================================
            //  选项点击逻辑
            // ============================================================
            function handleOptionClick(clickedIndex) {
                if (answered) return; // 已作答不可再选

                const q = QUESTIONS[currentIndex];
                const isCorrect = (clickedIndex === q.correct);
                const allOptions = document.querySelectorAll('.option-btn');

                // 标记已作答
                answered = true;
                selectedIndex = clickedIndex;
                nextBtn.disabled = false;

                // 禁用所有选项
                allOptions.forEach(btn => btn.classList.add('disabled'));

                // 高亮选中的选项
                const clickedBtn = allOptions[clickedIndex];
                if (isCorrect) {
                    clickedBtn.classList.add('correct');
                    score += 1;
                    results[currentIndex] = true;
                    feedbackMessage.className = 'feedback-message correct';
                    feedbackMessage.innerHTML = `
                        <span class="emoji">✅</span> 回答正确！
                        <span class="explanation">${q.explanation}</span>
                    `;
                } else {
                    clickedBtn.classList.add('wrong');
                    results[currentIndex] = false;
                    // 显示正确答案
                    allOptions[q.correct].classList.add('reveal-correct');
                    feedbackMessage.className = 'feedback-message wrong';
                    feedbackMessage.innerHTML = `
                        <span class="emoji">❌</span> 回答错误
                        <span class="explanation">正确答案是 ${['A','B','C','D'][q.correct]}：${q.options[q.correct]}<br>${q.explanation}</span>
                    `;
                }

                updateScore();
            }

            // ============================================================
            //  下一题 / 完成
            // ============================================================
            function goToNext() {
                if (!answered) return;

                if (currentIndex < TOTAL - 1) {
                    // 还有下一题
                    currentIndex++;
                    renderQuestion(currentIndex);
                } else {
                    // 所有题目完成 → 显示结果
                    showResult();
                }
            }

            // ============================================================
            //  结果面板
            // ============================================================
            function showResult() {
                quizContainer.style.display = 'none';
                resultPanel.classList.add('show');

                const correctCount = results.filter(r => r === true).length;
                const wrongCount = results.filter(r => r === false).length;

                resultCorrect.textContent = correctCount;
                resultWrong.textContent = wrongCount;
                resultScore.textContent = score;

                // 根据得分给出评语
                let emoji, title, sub;
                const pct = correctCount / TOTAL;
                if (pct === 1) {
                    emoji = '🏅';
                    title = '完美通关！';
                    sub = '你对下肢带骨的知识掌握得非常好！';
                } else if (pct >= 0.8) {
                    emoji = '🌟';
                    title = '非常优秀！';
                    sub = '你对下肢带骨的结构有扎实的理解。';
                } else if (pct >= 0.6) {
                    emoji = '💪';
                    title = '还不错！';
                    sub = '继续复习，巩固一下薄弱的知识点。';
                } else if (pct >= 0.4) {
                    emoji = '📖';
                    title = '需要加强复习';
                    sub = '建议回顾下肢带骨的解剖结构。';
                } else {
                    emoji = '🔁';
                    title = '再试一次吧';
                    sub = '别灰心，多复习几遍一定能掌握！';
                }
                resultEmoji.textContent = emoji;
                resultTitle.textContent = title;
                resultSub.textContent = sub;

                // 进度条填满
                progressFill.style.width = '100%';
                progressText.textContent = `完成！`;
                progressPercent.textContent = '100%';
            }

            // ============================================================
            //  重新开始
            // ============================================================
            function restartGame() {
                // 重置状态
                currentIndex = 0;
                score = 0;
                answered = false;
                selectedIndex = -1;
                for (let i = 0; i < TOTAL; i++) results[i] = null;

                // 隐藏结果，显示游戏
                resultPanel.classList.remove('show');
                quizContainer.style.display = 'block';

                // 重置 UI
                updateScore();
                renderQuestion(0);
                feedbackMessage.className = 'feedback-message';
                feedbackMessage.innerHTML = `<span class="emoji">💡</span> 选择一个选项作答`;
                nextBtn.disabled = true;
            }

            // ============================================================
            //  事件绑定
            // ============================================================
            nextBtn.addEventListener('click', goToNext);
            restartBtn.addEventListener('click', restartGame);

            // 键盘快捷键：Enter 触发下一题
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !nextBtn.disabled) {
                    goToNext();
                }
            });

            // ============================================================
            //  初始化
            // ============================================================
            function init() {
                // 重置所有状态
                for (let i = 0; i < TOTAL; i++) results[i] = null;
                currentIndex = 0;
                score = 0;
                answered = false;
                selectedIndex = -1;

                resultPanel.classList.remove('show');
                quizContainer.style.display = 'block';

                updateScore();
                renderQuestion(0);
                feedbackMessage.className = 'feedback-message';
                feedbackMessage.innerHTML = `<span class="emoji">💡</span> 选择一个选项作答`;
                nextBtn.disabled = true;
            }

            init();

        })();
    </script>

</body>
</html>
